name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: 'Node CI (Lint, Typecheck, Test, Build via Dudesons/node)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Lint, Typecheck, Coverage Tests & SPA Build
        uses: dagger/dagger-for-github@f8f5cba17a33e559ce14ba624d6b64153d1412a4 # v7.0.6
        with:
          version: 'v0.21.8'
          verb: call
          module: github.com/Dudesons/daggerverse/nodejs@20025a28c86e11511da0c8b23b8701c85b6b1e50
          args: >-
            with-pipeline-id --pipeline-id="gobot-ui"
            with-version --version=24
            with-npm
            with-source --src=.
            install
            lint
            run --command=typecheck --capture-output=false
            run --command=test:coverage --capture-output=false
            build
            directory --path=coverage
            export --path=./coverage
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload Coverage to Codecov (via disaster37/dagger-library-go/codecov)
        if: env.CODECOV_TOKEN != ''
        uses: dagger/dagger-for-github@f8f5cba17a33e559ce14ba624d6b64153d1412a4 # v7.0.6
        with:
          version: 'v0.21.8'
          verb: call
          module: github.com/disaster37/dagger-library-go/codecov@e205189be6eba617e7bcc870db2e73a04171f38e
          args: upload --src=. --token=env:CODECOV_TOKEN --files=coverage/lcov.info
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  e2e:
    name: 'Playwright E2E (headless Chromium, mocked /backend/*)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image-ci:
    name: 'Docker Image CI (via build-core/node & disaster37/image)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: node-ci
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Static Nginx SPA Container (via gitlab.com/build-core/daggerverse/node)
        uses: dagger/dagger-for-github@f8f5cba17a33e559ce14ba624d6b64153d1412a4 # v7.0.6
        with:
          version: 'v0.21.8'
          verb: call
          module: gitlab.com/build-core/daggerverse/node@40f0992e623b325f9fe3717ba01e144535f539e2
          args: >-
            build-static
            --src=.
            --package-manager=npm
            --node-version=24
            --output-dir=.output/public
            --nginx-config-path=docker/nginx.conf
            sync
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Lint Dockerfile & Build Image (via disaster37/dagger-library-go/image)
        uses: dagger/dagger-for-github@f8f5cba17a33e559ce14ba624d6b64153d1412a4 # v7.0.6
        with:
          version: 'v0.21.8'
          verb: call
          module: github.com/disaster37/dagger-library-go/image@e205189be6eba617e7bcc870db2e73a04171f38e
          args: ci --source=. --dockerfile=Dockerfile
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
