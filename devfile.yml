schemaVersion: 2.2.0
metadata:
  name: dfp-ui
components:
  - name: tools
    container:
      image: node:24
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        - name: NUXT_TELEMETRY_DISABLED
          value: '1'
      endpoints:
        - name: api
          targetPort: 8080
          exposure: public
        - name: ui
          targetPort: 4200
          exposure: public
      memoryLimit: 4Gi
      cpuLimit: 4000m
      cpuRequest: 1000m
      memoryRequest: 2Gi
      mountSources: true
  - name: docker
    attributes:
      container-overrides:
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          runAsNonRoot: false
          runAsUser: 0
    container:
      image: docker:dind
      env:
        - name: 'DOCKER_TLS_CERTDIR'
          value: ''
      mountSources: true
      memoryLimit: 8Gi
      cpuLimit: 4000m
      cpuRequest: 1000m
      memoryRequest: 1Gi

commands:
  - id: install
    exec:
      label: '1.1 Install dependencies'
      component: tools
      workingDir: ${PROJECT_SOURCE}/
      commandLine: 'npm ci'
      group:
        kind: build

  - id: run
    exec:
      label: '1.2 Run'
      component: tools
      workingDir: ${PROJECT_SOURCE}/
      commandLine: 'npm run dev'
      group:
        kind: run

  - id: stop
    exec:
      label: '1.3 Stop'
      component: tools
      commandLine: 'pkill -f "nuxt dev" || true'
      group:
        kind: run

  - id: test
    exec:
      label: '1.4 Test'
      component: tools
      workingDir: ${PROJECT_SOURCE}/
      commandLine: 'npm run test:coverage'
      group:
        kind: test

  - id: lint
    exec:
      label: '1.5 Lint'
      component: tools
      workingDir: ${PROJECT_SOURCE}/
      commandLine: 'npm run lint'
      group:
        kind: test

  - id: typecheck
    exec:
      label: '1.6 Typecheck'
      component: tools
      workingDir: ${PROJECT_SOURCE}/
      commandLine: 'npm run typecheck'
      group:
        kind: test

  - id: build
    exec:
      label: '1.7 Build'
      component: tools
      workingDir: ${PROJECT_SOURCE}/
      commandLine: 'npm run build'
      group:
        kind: build
